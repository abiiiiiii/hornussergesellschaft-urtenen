<div class="home">
  <div class="content">
    <div class="title">
      <h1 id="title">Home</h1>
      <h2>Willkommen auf der offiziellen Webseite der Hornusser-Gesellschaft Urtenen.</h2>
    </div>

    <div class="news-container">
      @if (authService.currentUser()?.role == 'admin') {
        <div class="add" (click)="addNews()">
          <mat-icon aria-hidden="false" aria-label="Example home icon">note_add</mat-icon>
          <p>Neuigkeit hinzufügen</p>
        </div>
      }
      @for (n of news; track n) {
        <app-news [news]="n"></app-news>
      }
      @if (news.length == 0) {
        <p>Aktuell gibt es keine neuen Meldungen...</p>
      }
    </div>
    <div class="break-line"></div>
  </div>
  <div class="sidebar">
    <div class="sponsor">
      <app-main-sponsors></app-main-sponsors>
    </div>
    <div class="latest-games">
      <app-latest-games></app-latest-games>
    </div>
  </div>
</div>
