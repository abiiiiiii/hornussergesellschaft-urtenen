@if (news) {
  <div class="news">
    <div class="title">
      <h3>| {{news.title}}</h3>
      @if (authService.currentUser()?.role == 'admin') {
        <div class="admin-actions">
          <mat-icon class="action-btn edit-btn" (click)="edit()" title="Bearbeiten">edit</mat-icon>
          <mat-icon class="action-btn delete-btn" (click)="delete()" title="Löschen">delete</mat-icon>
        </div>
      }
    </div>
    <div class="content">
      <div class="image">
        <img [src]="imageUrl$ | async" alt="">
      </div>
      <div class="message">
        <div class="text">
          @for (text of news.description; track text) {
            <p>{{text}}</p>
          }
        </div>
        @if (flyerUrl$) {
          <a [href]="flyerUrl$ | async" target="_blank" class="link">... zum Flyer</a>
        }
      </div>
    </div>
  </div>
}
