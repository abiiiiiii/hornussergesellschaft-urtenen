<div class="add-album">
  @if (albumForm) {
    <form [formGroup]="albumForm">
      <mat-form-field class="input" appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name"/>
      </mat-form-field>
      <mat-form-field class="input" appearance="fill">
        <mat-label>Jahr</mat-label>
        <input matInput type="number" minlength="4" maxlength="4" formControlName="year"/>
      </mat-form-field>
      <mat-form-field class="input" appearance="fill">
        <mat-label>Autor</mat-label>
        <input matInput type="text" formControlName="author"/>
      </mat-form-field>
      <div class="upload">
        <label for="image-upload">Bilder</label>
        <input id="image-upload" type="file" accept="image/jpeg,image/png" (change)="handleImagesInput($event)" multiple/>
      </div>
      <button (click)="add()">Fotoalbum hinzufügen</button>
      @if (isCreating) {
        <mat-spinner class="spinner"></mat-spinner>
      }
      @if (showValidationErrorMessage) {
        <p class="errorMessage">Die ausgefüllte Form ist invalid!</p>
      }
      @if (showCreationErrorMessage) {
        <p class="errorMessage">Resultat konnte nicht erstellt werden! Versuche es erneut.</p>
      }
    </form>
  }
</div>
