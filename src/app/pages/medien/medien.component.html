<div class="photo">
  <h1>Fotos</h1>
  @if (authService.currentUser()?.role == 'admin') {
    <div class="add" (click)="addAlbum()">
      <mat-icon aria-hidden="false" aria-label="Example home icon">note_add</mat-icon>
      <p>Fotoalbum hinzufügen</p>
    </div>
  }

  @for (year of years; track year) {
    <div class="years">
      <h2>{{year}}</h2>
      @for (album of getAlbumsByYear(year); track album) {
        <div class="album">
          <div class="album-cover" (click)="openAlbum($event, '/photos/' + album.id)">
            <img [src]="album.cover" alt="cover" width="100%" style="cursor: pointer;">
            <div class="overlay">
              <p>{{album.name}}</p>
              @if (authService.currentUser()?.role == 'admin') {
                <div class="actions">
                  <mat-icon (click)="edit(album)">edit</mat-icon>
                  <mat-icon (click)="delete(album)">delete</mat-icon>
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  }

</div>
