@if (album) {
  <div class="album">
    <h2>{{album.name}}</h2>
    <ngx-masonry [ordered]="true">
      @for (image of masonryImages; track image) {
        <div class="image" ngxMasonryItem (click)="openLightbox(image)">
          <img [src]="image.url" width="100%" style="cursor: pointer;">
        </div>
      }
    </ngx-masonry>
    @if (lightboxImage) {
      <app-photo-lightbox class="lightbox" [image]="lightboxImage"
        (previous)="previousImage()"
        (next)="nextImage()"
      (close)="closeLightbox()"></app-photo-lightbox>
    }
    <div>
      <div class="break-line"></div>
      @if (album.author) {
        <p>Fotos von {{album.author}}</p>
      }
    </div>
  </div>
}
