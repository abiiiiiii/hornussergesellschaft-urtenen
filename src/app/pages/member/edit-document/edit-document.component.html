<div class="edit-document" xmlns="http://www.w3.org/1999/html">
  <form [formGroup]="form">
    <mat-form-field class="input" appearance="fill">
      <mat-label>Name</mat-label>
      <input type="text" matInput formControlName="name"/>
    </mat-form-field>

    <div class="upload">
      <label for="flyer-upload">Dokument hochladen: </label>
      <input id="flyer-upload" type="file" (change)="uploadDocument($event)" accept="application/pdf"/>
    </div>

    @if (!isUpdating) {
      <button (click)="update()">Dokument updaten</button>
    }
    @if (isUpdating) {
      <mat-spinner class="spinner"></mat-spinner>
    }

    @if (showValidationErrorMessage) {
      <p class="errorMessage">Name und Dokument sind erforderlich!</p>
    }
    @if (showCreationErrorMessage) {
      <p class="errorMessage">Dokument konnte nicht hinzugefügt werden! Versuche es erneut.</p>
    }
  </form>
</div>
