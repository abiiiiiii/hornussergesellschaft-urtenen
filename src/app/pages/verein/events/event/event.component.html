@if (event) {
  <div class="event">
    <div class="title">
      <h3>{{event.date | date:'dd.MM.yyyy'}} | {{event.title}}</h3>
      @if (authService.currentUser()?.role == 'admin') {
        <mat-icon (click)="edit()">edit</mat-icon>
      }
      @if (authService.currentUser()?.role == 'admin') {
        <mat-icon (click)="delete()">delete</mat-icon>
      }
    </div>
    <div class="content">
      <div class="image">
        <img [src]="imageUrl$ | async" alt="">
      </div>
      <div class="message">
        <div class="text">
          @for (text of event.description; track text) {
            <p>{{text}}</p>
          }
        </div>
        @if (flyerUrl$) {
          <a [href]="flyerUrl$ | async" target="_blank" class="link">... zum Flyer</a>
        }
      </div>
    </div>
  </div>
}
