@if (sponsor) {
  <div class="sponsor" [class.column]="column">
    @if (sponsor.type != 'PRIVATE_DONATOR') {
      <a class="image" [href]="sponsor.url" target="_blank">
        <img [src]="imageUrl$ | async" alt="">
      </a>
      <div class="infos">
        <p>{{sponsor.name}}</p>
        <p>{{sponsor.description}}</p>
        <p>{{sponsor.postalCode}} {{sponsor.city}}</p>
        @if (sponsor.email) {
          <a href="mailto:{{sponsor.email}}" target="_blank">{{sponsor.email}}</a>
        }
        <p>{{sponsor.phoneNumber}}</p>
        @if (sponsor.url) {
          <a [href]="sponsor.url" target="_blank">...zur Webseite</a>
        }
      </div>
    } @else {
      <div class="private-donator">
        <div class="infos">
          <p>{{sponsor.name}}</p>
          <p>{{sponsor.city}}</p>
        </div>
      </div>
    }
  </div>
}
